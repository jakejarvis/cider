name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  build:
    runs-on: macos-latest
    needs: check

    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (${{ matrix.arch }})
        run: bun run build:${{ matrix.arch }}

      - name: Verify binary runs (${{ matrix.arch }})
        run: |
          ./dist/cider-darwin-${{ matrix.arch }} --version
          ./dist/cider-darwin-${{ matrix.arch }} --help
