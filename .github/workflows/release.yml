name: Release

on:
  push:
    tags:
      - "v*"

env:
  BUNDLE_ID: com.jakejarvis.cider

jobs:
  build-and-sign:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Build binary
        run: bun run build:${{ matrix.arch }}

      - name: Import certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign binary
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --sign "Developer ID Application: Jake Jarvis ($TEAM_ID)" \
            --entitlements entitlements.plist \
            --timestamp \
            --identifier "$BUNDLE_ID" \
            dist/cider-darwin-${{ matrix.arch }}

          # Verify signature
          codesign --verify --verbose dist/cider-darwin-${{ matrix.arch }}
          echo "Signature verified successfully"

          # Display entitlements for verification
          codesign --display --entitlements - dist/cider-darwin-${{ matrix.arch }}

      - name: Notarize binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          # Create zip for notarization (notarytool requires zip/dmg/pkg)
          ditto -c -k --keepParent \
            dist/cider-darwin-${{ matrix.arch }} \
            dist/cider-darwin-${{ matrix.arch }}.zip

          # Submit for notarization and wait for completion
          xcrun notarytool submit dist/cider-darwin-${{ matrix.arch }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          echo "Notarization complete"

          # Clean up zip (we release the bare binary, not the zip)
          rm dist/cider-darwin-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cider-darwin-${{ matrix.arch }}
          path: dist/cider-darwin-${{ matrix.arch }}

  release:
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum cider-darwin-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cider-darwin-arm64
            dist/cider-darwin-x64
            dist/checksums.txt
